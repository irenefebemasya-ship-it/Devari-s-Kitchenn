<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devari App</title>

<style>
body {
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#0f0f0f;
  color:white;
}

/* HEADER */
.header {
  padding:15px;
  background:linear-gradient(90deg,#ff0000,#ff7300);
  border-bottom-left-radius:20px;
  border-bottom-right-radius:20px;
}
.header h2 {margin:0;}
.header small {opacity:0.8;}

/* SEARCH */
.search {
  margin:10px;
}
.search input {
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
}

/* TAB */
.tabs {
  display:flex;
  justify-content:space-around;
  margin-top:10px;
}
.tabs button {
  background:none;
  border:none;
  color:white;
  padding:8px;
}
.tabs button.active {
  border-bottom:2px solid red;
}

/* CARD */
.card {
  background:#1a1a1a;
  margin:12px;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(255,0,0,0.2);
  transition:0.3s;
}
.card:hover {
  transform:scale(1.02);
}

.card img {
  width:100%;
  height:150px;
  object-fit:cover;
}

.content {
  padding:10px;
}

.badge {
  background:red;
  padding:3px 8px;
  border-radius:8px;
  font-size:12px;
}

.btn {
  background:linear-gradient(90deg,red,orange);
  border:none;
  padding:8px;
  border-radius:10px;
  color:white;
  width:100%;
}

/* CART */
.cart {
  position:fixed;
  bottom:0;
  width:100%;
  background:#1a1a1a;
  padding:10px;
  display:flex;
  justify-content:space-between;
}

/* FLOAT */
.wa {
  position:fixed;
  bottom:80px;
  right:15px;
  background:#25D366;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}
</style>
</head>

<body>

<div class="header">
  <h2>🔥 Devari Dapur Enak</h2>
  <small>Mie Pedas Level Bisa Dipilih</small>
</div>

<div class="search">
<input placeholder="Cari menu...">
</div>

<div class="tabs">
<button class="active">Menu</button>
</div>

<!-- MENU -->
<div class="card">
<img src="https://i.imgur.com/6XK6p0M.jpg">
<div class="content">
<span class="badge">🔥 Best Seller</span>
<h3>Mie Pedas</h3>
<p>10K | Level 🌶️1-4</p>
<button class="btn" onclick="add('Mie Pedas',10000)">Tambah</button>
</div>
</div>

<div class="card">
<img src="https://i.imgur.com/kb6Z9Wn.jpg">
<div class="content">
<h3>Milo</h3>
<p>10K</p>
<button class="btn" onclick="add('Milo',10000)">Tambah</button>
</div>
</div>

<div class="card">
<img src="https://i.imgur.com/Ch6z8pX.jpg">
<div class="content">
<h3>Dimsum</h3>
<p>3K</p>
<button class="btn" onclick="add('Dimsum',3000)">Tambah</button>
</div>
</div>

<!-- CART -->
<div class="cart">
Total: Rp <span id="total">0</span>
<button class="btn" style="width:auto" onclick="checkout()">Pesan</button>
</div>

<div class="wa" onclick="checkout()">💬</div>

<script>
let total=0;
let list=[];

function add(n,h){
  total+=h;
  list.push(n);
  document.getElementById("total").innerText=total;
}

function checkout(){
  let txt="Halo saya mau pesan:%0A";
  list.forEach(i=>txt+="- "+i+"%0A");
  txt+="Total: "+total;

  window.open("https://wa.me/6280000000000?text="+txt);
}
</script>

</body>
</html>
